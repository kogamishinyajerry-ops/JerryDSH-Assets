      name: /Users/Zhuanz/.dsh/plugins/jerry-school/index.js
# Z.ai/BigModel 联网搜索 MCP 桥(~/.dsh/mcp/zai-mcp/bridge.mjs,e2e 实测 2026-08-31):
# 工具 mcp__zai__web_search = coding 端点内置 web_search 通道(走 GLM Coding
# Plan 模型额度,不开 MCP 资源包即可用)。key 启动时从 macOS Keychain 服务
# glm-api-key 读取,不落盘。官方 MCP 网关直通(webSearchSogou/Quark,需资源包)
# 见桥内 ZAI_ENABLE_GATEWAY=1,默认关。
- insert:
    - id: mcp-zai-websearch
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: zai
        transport: stdio
        command: node
        args:
          - /Users/Zhuanz/.dsh/mcp/zai-mcp/bridge.mjs
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        reconnect:
          enabled: true

# [2026-09-29] 暂禁 vision-toolkit：0.1.44/0.1.45 仅适配 dsh ≤0.1.5，
# 0.1.7-rc.2 移除 ctx.settings.register 导致激活失败。等上游发 0.1.7 兼容版后
# 删除本条即可恢复（bundle 仍保留在 package.json）。
- id: vision-toolkit
  disabled: true

# [2026-09-18] 0.1.6 隐私红线：关闭会话事件上报（内网部署红线，见 research/06-update-tracker.md §3.7）
- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: zai-coding-cn
    model: glm-5.3
    reasoningEffort: max
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      # [2026-09-30] 智谱 GLM Coding Plan（新 key + coding 专用端点，实测 curl 双协议 200）
      # Anthropic 协议备用端点: https://open.bigmodel.cn/api/anthropic
      zai-coding-cn:
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/coding/paas/v4
        apiKeyEnv: ZAI_CODING_CN_API_KEY
        models:
          - id: glm-5.3
            name: GLM-5.3
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
          - id: glm-5.3-flash
            name: GLM-5.3-Flash
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
          - id: glm-5.3-flashx
            name: GLM-5.3-FlashX
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
          - id: glm-5.2
            name: GLM-5.2
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
          - id: glm-4.7
            name: GLM-4.7
            contextWindow: 200000
            maxTokens: 128000
            input:
              - text
      minimax-cn:
        models:
          - id: MiniMax-M3
            name: MiniMax-M3
            contextWindow: 1000000
            maxTokens: 128000
        apiKeyEnv: MINIMAX_CN_API_KEY
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
