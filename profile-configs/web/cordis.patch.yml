# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# ComfyUI MCP server (comfyui-mcp@0.51.56) — local install at ~/.dsh/mcp/comfyui-mcp
# Tools appear as mcp__comfyui__<name> in every new conversation of this profile.
- insert:
    - id: mcp-comfyui
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: comfyui
        transport: stdio
        command: node
        args:
          - /Users/Zhuanz/.dsh/mcp/comfyui-mcp/node_modules/comfyui-mcp/dist/index.js
        cwd: /Users/Zhuanz/.dsh/mcp/comfyui-mcp
        env:
          COMFYUI_URL: http://127.0.0.1:8188
          COMFYUI_PATH: /Users/Zhuanz/projects/jerry-personal/JerryComfyUI/ComfyUI
        toolCallTimeoutMs: 3600000
        failOnStartupError: false
        reconnect:
          enabled: true
