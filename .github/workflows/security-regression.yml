name: Security regression (Linux + macOS)

'on':
  push:
    branches: [codex/p0-acceptance-ci-20261002]
  pull_request:
    paths:
      - .githooks/**
      - tools/security/**
      - tests/security/**
      - .github/workflows/security-regression.yml
      - docs/acceptance/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.13']
    steps:
      - name: Checkout exact candidate (not a moving branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run 47 tests under real and symlinked temporary paths
        shell: bash
        run: python -S tools/security/run_ci.py --out "$RUNNER_TEMP/security-results"
      - name: Preserve only synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/security-results/*.json
            ${{ runner.temp }}/security-results/*.log
          if-no-files-found: error
          retention-days: 7
